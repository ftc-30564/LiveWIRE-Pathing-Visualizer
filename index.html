<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
    <title>Document</title>

</head>
<body>
    <div id="top">
        <div>
            <button id="clear-btn">Test</button>
        </div>
        <div style="display: flex; flex-direction: row; align-items: center; gap: 10px; padding-right: 10px;">
            <p style="padding: 5px; margin-left: 10px; cursor: pointer;" id="settings-button">Settings</p>
            <button id="upload-btn">Upload</button>
            <button id="export-btn">Export</button>
        </div>
    </div>
    <div id="main">
        <div id="sidebar">
            <div id="waypoints">
                    
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 10px;">
                <button id="add-waypoint">+   Add Waypoint   +</button>
                <button id="add-path-break">+   Add Path Break   +</button>
            </div>

        </div>
        <div id="field">
            <canvas id="field-canvas"></canvas>

            <div id="timeline">
                <div id="timeline-progress"></div>
                <div id="timeline-markers"></div>
                <div id="timeline-handle"></div>
            </div>
        </div>


    </div>

    <div id="settings">
        <p id="settings-exit" style="cursor: pointer; text-align: right;">Exit</p>
        <h2 style="text-align: center; border-bottom: 2px solid rgb(64, 64, 64);">Settings</h2>

        <div class="other">
            <label>Default Max Velocity:</label>
            <input type="number" id="settings-vel">
            <label class="unit">in/s</label>
        </div>

        <div class="other">
            <label>Default Max Accel:</label>
            <input type="number" id="settings-accel">
            <label class="unit">in/s<sup>2</sup></label>
        </div>

        <div class="other">
            <label>Default Max Decel:</label>
            <input type="number" id="settings-decel">
            <label class="unit">in/s<sup>2</sup></label>
        </div>

        <div class="other">
            <label>Default Waypoint Tolerance:</label>
            <input type="number" id="settings-tolerance">
            <label class="unit">in</label>
        </div>

        <div class="other">
            <label>Slowdown Ratio:</label>
            <input type="number" id="settings-slowdown">
        </div>

        <button id="save-settings">Save</button>
    </div>

    <!-- <h2 style="color: black;" id="debug-text"></h2> -->

    <div id="java-generation">
        <pre><code id="java-code"></code></pre>
    </div>

    <script src="js/settings.js"></script>
    <script src="js/waypoint.js"></script>
    <script src="js/path.js"></script>
    <script src="js/robot.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/export.js"></script>

    <script src="js/main.js"></script>
    <script src="js/inputs.js"></script>
</body>
</html>
